<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Potree Player</title>
  <link rel="stylesheet" href="/potree/build/potree/potree.css" />
  <link rel="stylesheet" href="/potree/libs/jquery-ui/jquery-ui.min.css" />

  <style>
    :root {
      --hud-h: 3.2rem;
      --hud-offset: 0px;
      --content-offset: 0px;
      --safe-top: max(env(safe-area-inset-top), -webkit-env(safe-area-inset-top), 24px);
      --safe-right: max(env(safe-area-inset-right), -webkit-env(safe-area-inset-right), 24px);
      --safe-bottom: max(env(safe-area-inset-bottom), -webkit-env(safe-area-inset-bottom), 24px);
      --safe-left: max(env(safe-area-inset-left), -webkit-env(safe-area-inset-left), 24px);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior: none;
      box-sizing: border-box;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", Arial;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.92);
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
      overflow: hidden;
      touch-action: none;
      background: #000;
      transform: none;
      transform-origin: top center;
    }

    /* ===== 顶部状态条（占位高度决定 potree_container 的 top） ===== */

    /* ===== Potree 容器：顶部留出 HUD ===== */

    #hud {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--hud-offset);
      min-height: var(--hud-h);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 12px 10px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      overflow: hidden;
      white-space: nowrap;
      user-select: none;
      border-radius: 10px;
    }

    .hud-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      margin-bottom: 2px;
    }

    .hud-title {
      font-weight: 700;
      opacity: 0.92;
      margin-right: 6px;
    }

    .hud-metrics {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.85;
      font-variant-numeric: tabular-nums;
      overflow: hidden;
    }

    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.10);
      font-size: 13px;
    }

    .hud-pill strong {
      font-weight: 700;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2px;
    }

    .storage {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      opacity: 0.9;
      font-variant-numeric: tabular-nums;
    }

    .storage-bar {
      width: 90px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .storage-fill {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #ffb800, #ff6b00);
    }

    .battery {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      opacity: 0.9;
      font-variant-numeric: tabular-nums;
    }

    .batt-bars {
      display: flex;
      gap: 2px;
      align-items: flex-end;
    }

    .batt-bars i {
      width: 6px;
      height: 10px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.22);
      display: block;
    }

    .batt-bars i.on {
      background: rgba(80, 255, 160, 0.85);
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-icon:active {
      transform: scale(0.98);
    }

    #potree_container {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(var(--hud-h) + 8px + var(--hud-offset) + var(--content-offset));
      bottom: 0;
      touch-action: auto;
      overflow: hidden;
      border-radius: 10px;
    }

    canvas {
      width: 100%;
      height: 100%;
      touch-action: auto;
    }

    /* ===== 叠加扫描 UI（左侧/右侧/弹窗/中间卡片） ===== */
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      /* 关键：不挡 potree 手势 */
    }

    .rightbar {
      position: absolute;
      right: 0;
      top: calc(var(--hud-h) + 18px + var(--hud-offset));
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
      pointer-events: auto;
    }

    .recordBtn {
      width: 64px;
      height: 64px;
      border-radius: 999px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    .recordDot {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: #ff4d4f;
      box-shadow: 0 0 0 2px rgba(255, 77, 79, 0.35);
    }

    .recordStop {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #ff4d4f;
      box-shadow: 0 0 0 2px rgba(255, 77, 79, 0.35);
    }

    .recTime {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      opacity: 0.85;
      margin-top: -8px;
    }

    .cornerBtn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.92);
      font-size: 18px;
    }

    .logoCard {
      position: absolute;
      left: calc(var(--safe-left) + 14px);
      bottom: calc(var(--safe-bottom) + 14px);
      width: 160px;
      height: 90px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .logoCard .logo {
      width: 90px;
      height: 60px;
      border-radius: 14px;
      background:
        radial-gradient(circle at 30% 30%, rgba(170, 255, 80, 0.25), transparent 55%),
        linear-gradient(135deg, rgba(170, 255, 80, 0.35), rgba(255, 255, 255, 0.05));
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .logoCard .ver {
      position: absolute;
      bottom: 8px;
      left: 10px;
      font-size: 11px;
      opacity: 0.7;
    }

    /* 中间初始化卡片 */
    .centerCard {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: min(420px, 70vw);
      height: 170px;
      border-radius: 18px;
      background: rgba(30, 40, 60, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.10);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: none;
    }

    .centerCard .pin {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .centerCard .txt {
      font-weight: 700;
      opacity: 0.92;
      letter-spacing: 0.4px;
    }

    .hidden {
      display: none !important;
    }

    /* 弹窗遮罩 */
    .modalMask {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal {
      width: min(780px, 86vw);
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.70);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      padding: 18px 18px 14px;
      color: rgba(255, 255, 255, 0.92);
    }

    .modal.bigTitle {
      text-align: center;
    }

    .modal .slam {
      font-size: 72px;
      font-weight: 800;
      letter-spacing: 2px;
      opacity: 0.18;
      margin: 6px 0 -10px;
    }

    .modal .sub {
      font-size: 22px;
      font-weight: 700;
      opacity: 0.92;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
    }

    .label {
      width: 92px;
      opacity: 0.75;
      font-size: 14px;
    }

    .input,
    .select {
      flex: 1;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.92);
      padding: 0 12px;
      outline: none;
    }

    .startBtn {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      width: 70px;
      height: 70px;
      border-radius: 999px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 77, 79, 0.95);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(255, 77, 79, 0.18);
    }

    .startBtn:active {
      transform: translateY(-50%) scale(0.98);
    }

    .modalFooter {
      margin-top: 18px;
      opacity: 0.75;
      font-size: 13px;
      text-align: center;
    }

    /* 提示框 */
    .promptBox {
      width: min(520px, 74vw);
      border-radius: 18px;
      background: rgba(30, 40, 60, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 18px;
      text-align: center;
    }

    .promptBox .t {
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .promptBox .m {
      opacity: 0.86;
      margin-bottom: 14px;
    }

    .promptBox .close {
      border: 0;
      background: transparent;
      color: rgba(80, 255, 160, 0.9);
      font-weight: 800;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 12px;
    }

    .promptBox .close:active {
      background: rgba(255, 255, 255, 0.08);
    }

    @media (orientation: landscape) {
      :root {
        --hud-h: 2.6rem;
        --hud-offset: 16px;
        --content-offset: 30px;
        --safe-top: max(env(safe-area-inset-top), -webkit-env(safe-area-inset-top), 24px);
        --safe-bottom: max(env(safe-area-inset-bottom), -webkit-env(safe-area-inset-bottom), 24px);
      }

      .modal .slam {
        font-size: 64px;
      }
    }

    @media (max-width: 480px) {
      :root {
        --hud-h: 2.4rem;
        --hud-offset: 16px;
        --content-offset: 30px;
      }

      #hud {
        padding: 0.15rem 0.4rem 0.9rem;
        gap: 6px;
      }

      .hud-left,
      .hud-right {
        margin-bottom: 10px;
      }

      .hud-right {
        transform: translateY(-4px);
      }

      .hud-title {
        font-size: 12px;
      }

      .hud-pill {
        font-size: 11px;
        padding: 3px 8px;
      }

      .storage {
        font-size: 11px;
      }

      .storage-bar {
        width: 70px;
        height: 5px;
      }

      .battery {
        font-size: 11px;
      }

      .batt-bars i {
        width: 5px;
        height: 9px;
      }

      .rightbar {
        gap: 10px;
      }

      .cornerBtn {
        width: 36px;
        height: 36px;
        font-size: 16px;
      }

      .recordBtn {
        width: 54px;
        height: 54px;
      }

      .recordDot {
        width: 28px;
        height: 28px;
      }

      .recordStop {
        width: 22px;
        height: 22px;
      }

      .recTime {
        font-size: 11px;
      }

      .centerCard {
        width: min(320px, 80vw);
        height: 140px;
      }

      .centerCard .txt {
        font-size: 12px;
      }

      .modal {
        width: min(680px, 90vw);
      }

      .modal .slam {
        font-size: 56px;
      }

      .modal .sub {
        font-size: 18px;
      }

      .label {
        width: 76px;
        font-size: 12px;
      }

      .input,
      .select {
        height: 36px;
        font-size: 12px;
      }

      .startBtn {
        width: 60px;
        height: 60px;
      }

      .promptBox {
        width: min(420px, 84vw);
      }

      .promptBox .t {
        font-size: 16px;
      }

      .promptBox .m {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- 顶部状态条 -->
    <div id="hud">
      <div class="hud-left">
        <button class="btn-icon" id="btn_back" title="返回">返回</button>
        <div class="hud-title" id="scan_title">扫描待启动</div>

        <div class="hud-metrics">
          <span class="hud-pill">D: <strong id="d_val">0.00m</strong></span>
          <span class="hud-pill">v: <strong id="v_val">0.00m/s</strong></span>
          <span class="hud-pill" id="fix_pill"><strong id="fix_val">Fixed</strong></span>
        </div>
      </div>

      <div class="hud-right">
        <div class="storage">
          <span id="storage_txt">342/477GB</span>
          <div class="storage-bar">
            <div class="storage-fill" id="storage_fill"></div>
          </div>
        </div>
        <div class="battery">
          <div class="batt-bars" id="batt_bars">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
          <span id="batt_txt">94%</span>
        </div>
      </div>
    </div>

    <div id="potree_container"></div>

    <!-- 叠加 UI（不挡 potree 手势） -->
    <div id="overlay">
      <div class="rightbar">
        <button class="cornerBtn" id="btn_settings" title="设置">⚙</button>

        <div class="recordBtn" id="btn_record" title="录制">
          <div class="recordDot" id="record_shape"></div>
        </div>
        <div class="recTime" id="rec_time">00:00:00</div>

        <button class="cornerBtn" id="btn_cube" title="视图">▢</button>
        <button class="cornerBtn" id="btn_map" title="地图">⌖</button>
      </div>

      <!-- 初始化中间卡片 -->
      <div class="centerCard hidden" id="init_card">
        <div class="pin">📍</div>
        <div class="txt">静止初始化开始</div>
      </div>

      <!-- 配置弹窗（图2） -->
      <div class="modalMask hidden" id="modal_config_mask">
        <div class="modal" style="position:relative;">
          <div class="slam">2.0</div>
          <div class="sub">Real-time SLAM</div>

          <div class="row">
            <div class="label">项目名称</div>
            <input class="input" id="project_name" value="test" />
          </div>

          <div class="row">
            <div class="label">GNSS模式</div>
            <select class="select" id="gnss_mode">
              <option value="RTK" selected>RTK</option>
              <option value="PPK">PPK</option>
              <option value="None">None</option>
            </select>
          </div>

          <div class="startBtn" id="btn_start">启动</div>

          <div class="modalFooter">启动作业前，请保持设备处于静置状态</div>
        </div>
      </div>

      <!-- 提示框（图4） -->
      <div class="modalMask hidden" id="modal_prompt_mask">
        <div class="promptBox">
          <div class="t">提示</div>
          <div class="m">静止初始化完成，可正常开始使用设备</div>
          <button class="close" id="btn_prompt_close">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="./libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="./libs/other/BinaryHeap.js"></script>
  <script src="./libs/tween/tween.min.js"></script>
  <script src="./libs/d3/d3.js"></script>
  <script src="./libs/proj4/proj4.js"></script>
  <script src="./libs/i18next/i18next.js"></script>
  <script src="./libs/jstree/jstree.js"></script>
  <script src="./libs/spectrum/spectrum.js"></script>
  <script src="./libs/three.js/build/three.min.js"></script>
  <script src="./build/potree/potree.js"></script>
  <script src="./libs/plasio/js/laslaz.js"></script>

  <script>
    // 扫描 UI 状态机（新增）
    const ui = {
      scanTitle: document.getElementById("scan_title"),
      dVal: document.getElementById("d_val"),
      vVal: document.getElementById("v_val"),
      fixVal: document.getElementById("fix_val"),
      storageTxt: document.getElementById("storage_txt"),
      storageFill: document.getElementById("storage_fill"),
      battTxt: document.getElementById("batt_txt"),
      battBars: document.getElementById("batt_bars"),

      btnBack: document.getElementById("btn_back"),
      btnRecord: document.getElementById("btn_record"),
      recordShape: document.getElementById("record_shape"),
      recTime: document.getElementById("rec_time"),

      initCard: document.getElementById("init_card"),

      maskConfig: document.getElementById("modal_config_mask"),
      projectName: document.getElementById("project_name"),
      gnssMode: document.getElementById("gnss_mode"),
      btnStart: document.getElementById("btn_start"),

      maskPrompt: document.getElementById("modal_prompt_mask"),
      btnPromptClose: document.getElementById("btn_prompt_close"),
    };

    //全局状态机
    const state = {
      // idle -> config -> initializing -> prompt -> recording
      recordState: "idle",
      recording: false,
      loadingPaused: false,
      sec: 0,
      timer: null,

      // 状态栏设置，后续加入设备传输内容
      D: 0.00,
      v: 0.00,
      fix: "Fixed",
      storageUsed: 342,
      storageTotal: 477,
      battery: 94,

      project: "test",
      gnss: "RTK",
    };
    let waitForScansTimer = null;

    function pad2(n) { return String(n).padStart(2, "0"); }
    function fmtTime(sec) {
      const s = Math.max(0, sec | 0);
      const hh = (s / 3600) | 0;
      const mm = ((s % 3600) / 60) | 0;
      const ss = s % 60;
      return `${pad2(hh)}:${pad2(mm)}:${pad2(ss)}`;
    }

    function setVisible(el, visible) {
      el.classList.toggle("hidden", !visible);
    }

    function updateBatteryBars(p) {
      const bars = Math.round((Math.max(0, Math.min(100, p)) / 100) * 5);
      const nodes = ui.battBars.querySelectorAll("i");
      nodes.forEach((n, idx) => n.classList.toggle("on", idx < bars));
    }

    function updateHUD() {
      // 状态栏
      let title = "扫描待启动";
      if (state.recordState === "initializing") title = "扫描已启动";
      if (state.recordState === "recording") title = "扫描已启动";
      ui.scanTitle.textContent = title;

      ui.dVal.textContent = `${state.D.toFixed(2)}m`;
      ui.vVal.textContent = `${state.v.toFixed(2)}m/s`;
      ui.fixVal.textContent = state.fix;

      ui.storageTxt.textContent = `${state.storageUsed}/${state.storageTotal}GB`;
      const pct = Math.max(0, Math.min(100, (state.storageUsed / Math.max(1, state.storageTotal)) * 100));
      ui.storageFill.style.width = `${pct}%`;

      ui.battTxt.textContent = `${state.battery}%`;
      updateBatteryBars(state.battery);

      ui.recTime.textContent = fmtTime(state.sec);

      // ??????
      ui.recordShape.className = state.recording ? "recordStop" : "recordDot";

      // ???????
      setVisible(ui.initCard, state.recordState === "initializing");
    }

    function openConfig() {
      state.recordState = "config";
      state.project = ui.projectName.value || state.project;
      state.gnss = ui.gnssMode.value || state.gnss;
      setVisible(ui.maskConfig, true);
      setVisible(ui.maskPrompt, false);
      updateHUD();
    }

    function closeConfig() {
      setVisible(ui.maskConfig, false);
    }

    function startRecordingTimer(reset) {
      if (reset) {
        state.sec = 0;
      }
      if (state.timer) clearInterval(state.timer);
      state.timer = setInterval(() => {
        state.sec += 1;
        updateHUD();
      }, 1000);
    }

    function clearScansWaiter() {
      if (waitForScansTimer) {
        clearInterval(waitForScansTimer);
        waitForScansTimer = null;
      }
    }

    function startPlaybackWhenReady() {
      clearScansWaiter();

      // 实时模式：直接开始，不等待scans.json
      // 点云会通过WebSocket的FRAME消息实时推送
      if (!playing) {
        start();
        console.log("[实时模式] 开始接收实时点云数据");
      }
    }

    function beginRecording(resetTimer, keepPrompt) {
      state.recording = true;

    //自动聚焦模型，放在场景中央
    function framePointCloud(pc, fill = 0.45) {
      if (!pc?.boundingBox) return;
      const bbox = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
      const center = bbox.getCenter(new THREE.Vector3());
      const size = bbox.getSize(new THREE.Vector3());
      const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;
      const view = viewer.scene.view;
      const fovValue = viewer.getFOV ? viewer.getFOV() : viewer.fov || 60;
      const fovRad = (fovValue * Math.PI) / 180;
      const distForFull = radius / Math.tan(Math.max(0.1, fovRad * 0.5));
      const dist = distForFull / Math.max(0.1, fill);

      const pivot = center.clone();
      const dir = view.position.clone().sub(view.getPivot ? view.getPivot() : pivot);
      if (dir.length() < 1e-6) dir.set(1, 1, 1);
      dir.normalize().multiplyScalar(dist);

      view.position.copy(pivot.clone().add(dir));
      if (view.lookAt) view.lookAt(pivot);
      if (view.setPivot) view.setPivot(pivot);
      else if (view.pivot) view.pivot.copy(pivot);
    }

    //移动端手势控制
    function installMobileControls(viewerInstance, element) {
      const view = viewerInstance.scene.view;
      const ROT_SPEED = 0.005;
      const LONGPRESS_MS = 250;
      const TAP_SLOP = 8;

      let longPressTimer = null;
      let longPressActive = false;
      let last1 = null;
      let lastMid = null;
      let lastDist = 0;

      function getPivot() {
        if (view.getPivot) return view.getPivot().clone();
        if (view.pivot) return view.pivot.clone();
        return new THREE.Vector3();
      }
      function setPivot(p) {
        if (view.setPivot) view.setPivot(p);
        else if (view.pivot) view.pivot.copy(p);
      }

      function panByPixels(dx, dy) {
        const cam = viewerInstance.scene.getActiveCamera
          ? viewerInstance.scene.getActiveCamera()
          : viewerInstance.camera;
        if (!cam) return;
        const pivot = getPivot();
        const pos = view.position.clone();
        const dist = pos.distanceTo(pivot);
        const fovValue = viewerInstance.getFOV ? viewerInstance.getFOV() : viewerInstance.fov || 60;
        const fov = (fovValue * Math.PI) / 180;
        const h = element.clientHeight || window.innerHeight || 1;
        const worldPerPx = (2 * dist * Math.tan(fov / 2)) / h;

        const dir = new THREE.Vector3();
        cam.getWorldDirection(dir);
        const right = new THREE.Vector3().crossVectors(dir, cam.up).normalize();
        const up = cam.up.clone().normalize();

        const move = new THREE.Vector3()
          .addScaledVector(right, -dx * worldPerPx)
          .addScaledVector(up, dy * worldPerPx);

        view.position.add(move);
        pivot.add(move);
        setPivot(pivot);
        if (view.lookAt) view.lookAt(pivot);
      }

      function zoomByScale(scale) {
        if (!isFinite(scale) || scale <= 0) return;
        const pivot = getPivot();
        const pos = view.position.clone();
        const dir = pos.sub(pivot);
        const dist = dir.length();
        if (dist < 1e-6) return;
        const newDist = THREE.MathUtils.clamp(dist / scale, 0.1, 1e9);
        dir.normalize().multiplyScalar(newDist);
        view.position.copy(pivot.clone().add(dir));
        if (view.lookAt) view.lookAt(pivot);
      }

      function clearLongPress() {
        if (longPressTimer) clearTimeout(longPressTimer);
        longPressTimer = null;
        longPressActive = false;
      }

      element.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          const t = e.touches[0];
          last1 = { x: t.clientX, y: t.clientY };
          longPressActive = false;
          clearLongPress();
          longPressTimer = setTimeout(() => { longPressActive = true; }, LONGPRESS_MS);
        } else if (e.touches.length === 2) {
          clearLongPress();
          const a = e.touches[0];
          const b = e.touches[1];
          lastMid = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
          lastDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        }
        e.preventDefault();
      }, { passive: false });

      element.addEventListener("touchmove", (e) => {
        if (e.touches.length === 1 && last1) {
          const t = e.touches[0];
          const x = t.clientX, y = t.clientY;
          const dx = x - last1.x, dy = y - last1.y;

          if (!longPressActive && (Math.abs(dx) > TAP_SLOP || Math.abs(dy) > TAP_SLOP)) clearLongPress();

          if (longPressActive) panByPixels(dx, dy);
          else {
            view.yaw += -dx * ROT_SPEED;
            view.pitch += -dy * ROT_SPEED;
            view.pitch = THREE.MathUtils.clamp(view.pitch, -Math.PI / 2 + 0.01, Math.PI / 2 - 0.01);
          }

          last1 = { x, y };
          e.preventDefault();
        }

        if (e.touches.length === 2) {
          const a = e.touches[0];
          const b = e.touches[1];
          const mid = { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
          const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

          if (lastMid) panByPixels(mid.x - lastMid.x, mid.y - lastMid.y);
          if (lastDist > 0) zoomByScale(dist / lastDist);

          lastMid = mid;
          lastDist = dist;
          e.preventDefault();
        }
      }, { passive: false });

      element.addEventListener("touchend", (e) => {
        if (e.touches.length === 0) {
          clearLongPress();
          last1 = null;
          lastMid = null;
          lastDist = 0;
        } else if (e.touches.length === 1) {
          const t = e.touches[0];
          last1 = { x: t.clientX, y: t.clientY };
          lastMid = null;
          lastDist = 0;
          clearLongPress();
          longPressTimer = setTimeout(() => { longPressActive = true; }, LONGPRESS_MS);
        }
      }, { passive: true });
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function loadPointCloudOnce(url, name, timeoutMs) {
      return new Promise((resolve, reject) => {
        let done = false;
        const timer = setTimeout(() => {
          if (done) return;
          done = true;
          reject(new Error(`load timeout: ${url}`));
        }, timeoutMs);

        Potree.loadPointCloud(url, name, (event) => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(event);
        });
      });
    }

    async function loadPointCloudWithRetry(url, name, retries = 1, timeoutMs = 8000) {
      let lastErr = null;
      for (let attempt = 0; attempt <= retries; attempt += 1) {
        try {
          return await loadPointCloudOnce(url, name, timeoutMs);
        } catch (err) {
          lastErr = err;
          console.warn(`[loadPointCloud] failed attempt ${attempt + 1}/${retries + 1}:`, err?.message || err);
          if (attempt < retries) {
            await sleep(500);
          }
        }
      }
      throw lastErr || new Error("loadPointCloud failed");
    }

    function getPoseMatrixForFrame(id) {
      const pose =
        (poses && poses.perFrame && poses.perFrame[String(id)]) ||
        poses?.default ||
        identity;

      const matrix = new THREE.Matrix4();
      matrix.set(
        pose[0], pose[1], pose[2], pose[3],
        pose[4], pose[5], pose[6], pose[7],
        pose[8], pose[9], pose[10], pose[11],
        pose[12], pose[13], pose[14], pose[15]
      );
      return matrix;
    }

          // 位姿数据来自 pc_transmission.py 的 broadcast_pose()

          // 尝试从 poses 获取位姿
          const poseMatrix = getPoseMatrixForFrame(frame.id);
          const e = poseMatrix.elements;

          // 尝试提取位置（支持 row-major 和 col-major）
          const t1 = new THREE.Vector3(e[12], e[13], e[14]); // col-major
          const t2 = new THREE.Vector3(e[3], e[7], e[11]);   // row-major
          const posePos = (t1.lengthSq() > 1e-6) ? t1 : (t2.lengthSq() > 1e-6 ? t2 : null);

          if (posePos && isFinite(posePos.x) && isFinite(posePos.y) && isFinite(posePos.z)) {
            // ✅ 有有效位姿数据
            // 注意：不添加轨迹点，因为 Dart 代码中没有轨迹线
            // 只在 applyPose() 中处理实时位姿显示

            console.log("✓ 检测到位姿数据:", posePos.x.toFixed(2), posePos.y.toFixed(2), posePos.z.toFixed(2));

          console.warn("检查位姿数据失败:", err);

        console.log("✓ 加载成功 - 帧", frame.id, "点云对象:", pc);

        loadedQueue.push({ id: frame.id, pc });

    async function loadBatch(msg) {
      const event = await loadPointCloudWithRetry(
        msg.url,
        `batch_${msg.id}_${Date.now()}`,
        12,
        58000
      );
      const pc = event.pointcloud;
      pc.visible = true;

      if (Potree.PointColorType && Potree.PointColorType.RGB) {
        pc.material.pointColorType = Potree.PointColorType.RGB;
      }
      viewer.scene.addPointCloud(pc);
      batchQueue.push({ id: msg.id, pc });

      const covers = Array.isArray(msg.covers) ? msg.covers : null;
      if (covers && covers.length >= 2) {
        const startId = Number(covers[0]);
        const endId = Number(covers[1]);
        const keep = [];
        for (const item of loadedQueue) {
          if (item.id >= startId && item.id <= endId) {
            disposePointCloud(item.pc);
            loadedMap.delete(item.id);
          } else {
            keep.push(item);
          }
        }
        loadedQueue.length = 0;
        loadedQueue.push(...keep);
      } else {
        const removeCount = Math.max(1, Number(msg.count || BATCH_SIZE));
        for (let i = 0; i < removeCount; i += 1) {
          const old = loadedQueue.shift();
          if (!old) break;
          disposePointCloud(old.pc);
          loadedMap.delete(old.id);
        }
      }
    }

    function applyPose(pose) {
      // ✅ 参考 pointcloud_view.dart 的 _handleOdometryMessage (第290-313行)
      // 从 Odometry 消息中提取位置：msg['pose']['pose']['position']
      if (!viewer?.scene?.view) return;

      const p = pose.position || {};
      const x = Number(p.x || 0);
      const y = Number(p.y || 0);
      const z = Number(p.z || 0);

      // 验证位置数据有效性
      if (!isFinite(x) || !isFinite(y) || !isFinite(z)) {
        console.warn("applyPose: 无效的位置数据", p);
        return;
      }

      // 更新机器人位置
      robotPosition.set(x, y, z);
      robotPoseAvailable = true;
      hasCameraPose = true;

      const view = viewer.scene.view;
      view.position.set(x, y, z);

      console.log(`✓ 更新相机位置: (${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)})`);

      // 注意：只更新位置，不改变朝向
    }

    async function tick() {
      if (!playing || !scans?.frames?.length) return;
      if (frameIndex >= scans.frames.length) {
        stop();
        state.recording = false;
        state.loadingPaused = false;
        state.recordState = "idle";
        if (state.timer) clearInterval(state.timer);
        state.timer = null;
        updateHUD();
        return;
      }

      const frame = scans.frames[frameIndex];
      frameIndex += 1;

      try { await loadFrame(frame); }
      catch (e) { console.error("loadFrame failed", e); }
    }

    // function start() {
    //   if (!scans?.frames?.length) {
    //     console.warn("start() 被调用，但 scans 数据为空");
    //     return;
    //   }
    //   console.log("开始播放点云，共", scans.frames.length, "帧");
    //   stop();
    //   if (frameIndex >= scans.frames.length) frameIndex = 0;
    //   playing = true;
    //   const interval = scans.intervalMs ?? 500;
    //   timer = setInterval(tick, interval);
    //   tick();
    // }
    // function stop() {
    //   playing = false;
    //   if (timer) clearInterval(timer);
    //   timer = null;
    // }


    function start() {
      // 现在 start() = 告诉 PC 开始推帧
      playing = true;

      // 所以这里确保 WS 已连接再 PLAY
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "PLAY" }));
      } else {
        console.warn("start(): WS 未连接，无法 PLAY");
      }
    }

    function stop() {
      // 现在 stop() = 告诉 PC 停止推帧
      playing = false;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "STOP" }));
      }
    }


    // function setIntervalMs(ms) {
    //   if (!scans) scans = { intervalMs: ms, windowSize: 1, frames: [] };
    //   else scans.intervalMs = ms;
    //   if (playing) start();
    // }

    function setIntervalMs(ms) {
      if (!scans) scans = { intervalMs: ms, windowSize: 1, frames: [] };
      else scans.intervalMs = ms;

      // 同步给 PC（你的 PC 脚本支持 SET_INTERVAL）
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "SET_INTERVAL", ms: Number(ms) || 500 }));
      }
    }

    function setWindowSize(n) {
      if (!scans) scans = { intervalMs: 2000, windowSize: n, frames: [] };
      else scans.windowSize = n;
    }

    // function seek(i) {
    //   frameIndex = Math.max(0, i | 0);
    //   loadedQueue.forEach(({ pc }) => disposePointCloud(pc));
    //   loadedQueue.length = 0;
    //   loadedMap.clear();
    //   tick();
    // }

    function seek(i) {
      frameIndex = Math.max(0, i | 0);

      loadedQueue.forEach(({ pc }) => disposePointCloud(pc));
      loadedQueue.length = 0;
      loadedMap.clear();

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "SEEK", i: frameIndex }));
      }
    }

    // Http url 拉取json
    async function setScansFromUrl(url) {

      console.log("开始加载 scans.json:", url);
      const res = await fetch(url);
      scans = await res.json();
      frameIndex = 0;
      console.log("scans.json 加载完成，共", scans.frames?.length || 0, "帧");
    }

    async function setPosesFromUrl(url) {
      const res = await fetch(url);
      poses = await res.json();
      loadedQueue.forEach((item) => {
        const matrix = getPoseMatrixForFrame(item.id);
        item.pc.matrix.copy(matrix);
      });
    }

    // WebSocket 数据层（新增：只负责收发，不动渲染）
    let ws = null;
    let wsUrl = null;
    let datasetRootFromServer = null;
    let startAfterWs = false;

    // 你可以用ws=ws://10.100.2.20:8000/ws 来注入
    function isValidWsUrl(u) {
      if (!u) return false;
      if (u.includes("<PC局域网IP>")) return false;
      return /^wss?:\/\/[^\\s/$.?#].[^\\s]*$/i.test(u);
    }

    function getDefaultWsUrl() {
      const q = new URLSearchParams(location.search);
      const u = q.get("ws");
      if (isValidWsUrl(u)) return u;

      // 或者 localStorage 记住上次的
      const saved = localStorage.getItem("WS_URL");
      if (isValidWsUrl(saved)) return saved;

      // 兜底：你自己改成常用 IP
      return "ws://10.100.2.28:8000/ws";
    }

    function connectWS(url) {
      wsUrl = url || getDefaultWsUrl();
      if (isValidWsUrl(wsUrl)) {
        localStorage.setItem("WS_URL", wsUrl);
      }

      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        console.log("WS already connected/connecting:", wsUrl);
        return;
      }

      console.log("Connecting WS:", wsUrl);
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log("WS connected");
        // 先告知服务端客户端就绪，否则服务端不会广播实时帧
        ws.send(JSON.stringify({ type: "CLIENT_READY" }));
        // 你 PC 端 receiver 里允许 HELLO
        ws.send(JSON.stringify({ type: "HELLO", client: "player.html" }));
        // 可选：立即拉状态
        ws.send(JSON.stringify({ type: "GET_STATUS" }));

        if (AUTO_PLAY_ON_CONNECT) {
          playing = true;
          ws.send(JSON.stringify({ type: "PLAY" }));
        }

        // 如果用户已经在录制态，就让 PC 直接开始推
        if (state.recording && !state.loadingPaused) {
          ws.send(JSON.stringify({ type: "PLAY" }));
        }

        if (startAfterWs) {
          startAfterWs = false;
          startPlaybackWhenReady();
        }
      };

      ws.onclose = () => {
        console.log("WS closed");
      };

      ws.onerror = (e) => {
        console.error("WS error", e);
      };

      ws.onmessage = async (ev) => {
        let msg;
        try {
          msg = JSON.parse(ev.data);
        } catch (e) {
          return;
        }

        const t = msg.type;
        console.log("[WS] msg", t, msg);

        if (t === "DATASET_ROOT") {
          datasetRootFromServer = msg.root;
          console.log("DATASET_ROOT:", datasetRootFromServer);
          return;
        }

        if (t === "PUSH_SCANS") {
          // PC 端已经把 frames.url 改成绝对路径
          scans = msg.scans || null;
          frameIndex = 0;

          // 用 scans 里的 interval/windowSize 控制本地缓存窗口
          // intervalMs 由 server 推帧速度控制，这里只存一下
          console.log("SCANS received:", scans?.frames?.length || 0);

          return;
        }

        if (t === "PUSH_POSES") {
          poses = msg.poses || null;
          console.log("POSES received");
          return;
        }

        if (t === "FRAME") {
          // 实时帧：立即加载，不检查playing状态（录制开始后就应该显示）
          if (state.loadingPaused) return;
          if (!msg.url) return;

          const frame = { id: msg.id ?? frameIndex, url: msg.url };
          frameIndex = (msg.id ?? frameIndex) + 1;

          if (msg.pose) {
            applyPose(msg.pose);
          }

          console.log(`[实时帧] 收到第 ${frame.id} 帧，URL: ${frame.url}`);
          enqueueFrame(frame);
          return;
        }

        if (t === "BATCH") {
          // ✅ 批次降采样：立即加载
          if (state.loadingPaused) return;
          if (!msg.url) return;
          console.log(`[批次] 收到 batch_${msg.id}，替换帧 ${msg.covers?.[0]}-${msg.covers?.[1]}`);
          try {
            await loadBatch(msg);
          } catch (e) {
            console.error("loadBatch failed", e);
          }
          return;
        }

        if (t === "SUPER") {
          // ✅ 超级降采样：立即加载
          if (state.loadingPaused) return;
          if (!msg.url) return;
          console.log(`[超级] 收到 super_${msg.id}，替换 batch ${msg.replaceBatches}`);
          try {
            await loadSuper(msg);
          } catch (e) {
            console.error("loadSuper failed", e);
          }
          return;
        }

        if (t === "POSE") {
          if (msg.pose) {
            applyPose(msg.pose);
          }
          return;
        }
      };
    }

    function disconnectWS() {
      if (!ws) return;
      try { ws.close(); } catch (e) { }
      ws = null;
    }

    window.addEventListener("message", async (event) => {
      const msg = event.data || {};
      try {
        if (msg.type === "SET_SCANS_URL" && msg.url) {
          await setScansFromUrl(msg.url);
          event.source?.postMessage({ type: "SCANS_READY", frames: scans.frames?.length || 0 }, "*");
        } else if (msg.type === "SET_POSES_URL" && msg.url) {
          await setPosesFromUrl(msg.url);
          event.source?.postMessage({ type: "POSES_READY" }, "*");
        } else if (msg.type === "SET_WS_URL" && msg.url) {
          connectWS(msg.url);
        } else if (msg.type === "PLAY") {
          start();
        } else if (msg.type === "STOP") {
          stop();
        } else if (msg.type === "SET_INTERVAL") {
          setIntervalMs(Number(msg.ms) || 1000);
        } else if (msg.type === "SET_WINDOW") {
          setWindowSize(Math.max(1, Number(msg.n) || 1));
        } else if (msg.type === "SEEK") {
          seek(Number(msg.i) || 0);
        }
      } catch (error) {
        console.error("message handling failed", error);
      }
    });
  </script>
